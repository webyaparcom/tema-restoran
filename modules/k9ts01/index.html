  .modulex-yorum-zaman-akisi *, .modulex-yorum-zaman-akisi *::before, .modulex-yorum-zaman-akisi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-yorum-zaman-akisi :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-yorum-zaman-akisi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }

  .modulex-yorum-zaman-akisi img { display: block; max-width: 100%; }

  :where(.modulex-yorum-zaman-akisi) img { height: auto; }
  .modulex-yorum-zaman-akisi [hidden] { display: none !important; }
  .modulex-yorum-zaman-akisi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-yorum-zaman-akisi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-yorum-zaman-akisi-ic { max-width: --max--; margin-inline: auto; }

  .modulex-yorum-zaman-akisi-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-yorum-zaman-akisi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-yorum-zaman-akisi-ic { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(32px, 5vw, 80px); align-items: start; }
  .modulex-yorum-zaman-akisi-bas { position: sticky; inset-block-start: 96px; margin: 0; }
  .modulex-yorum-zaman-akisi--bassiz .modulex-yorum-zaman-akisi-ic { grid-template-columns: minmax(0, 1fr); }
  .modulex-yorum-zaman-akisi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-yorum-zaman-akisi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-yorum-zaman-akisi-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-yorum-zaman-akisi-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-yorum-zaman-akisi-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-yorum-zaman-akisi-ad { font-weight: 700; }
  .modulex-yorum-zaman-akisi-kisi { display: grid; gap: 2px; min-width: 0; }

  .modulex-yorum-zaman-akisi-puan .material-symbols-outlined { font-size: 20px; font-variation-settings: "FILL" 1; }
  .modulex-yorum-zaman-akisi-yildiz--bos { opacity: 0.3; }
  .modulex-yorum-zaman-akisi-avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
  .modulex-yorum-zaman-akisi-harf { display: inline-grid; place-items: center; background: color-mix(in srgb, --accent-- 18%, --kartBg--); color: --accentInk--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-yorum-zaman-akisi-yazar { display: flex; align-items: center; gap: 12px; }

  .modulex-yorum-zaman-akisi-akis { position: relative; display: grid; gap: 22px; }
  .modulex-yorum-zaman-akisi-akis::before { content: ""; position: absolute; inset-block: 10px; inset-inline-start: 25px; width: 2px; background: --cizgi--; }
  .modulex-yorum-zaman-akisi-oge { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 18px; align-items: start; transition: opacity 0.5s ease calc(var(--i) * 0.1s), transform 0.5s ease calc(var(--i) * 0.1s); }
  .modulex-yorum-zaman-akisi--hazir:not(.modulex-yorum-zaman-akisi--gor) .modulex-yorum-zaman-akisi-oge { opacity: 0; transform: translateY(14px); }
  .modulex-yorum-zaman-akisi-dugum { position: relative; display: grid; padding: 2px; border-radius: 50%; background: --bg--; box-shadow: 0 0 0 2px --accent--; }
  .modulex-yorum-zaman-akisi-avatar { width: 48px; height: 48px; font-size: 0.9rem; }
  .modulex-yorum-zaman-akisi-kart { display: grid; gap: 10px; padding: 20px 22px; border-radius: --yuvarlak--; background: --kartBg--; transition: transform 0.3s ease; }
  .modulex-yorum-zaman-akisi-oge:hover .modulex-yorum-zaman-akisi-kart { transform: translateX(4px); }
  [dir="rtl"] .modulex-yorum-zaman-akisi-oge:hover .modulex-yorum-zaman-akisi-kart { transform: translateX(-4px); }
  .modulex-yorum-zaman-akisi-kart-ust { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; }
  .modulex-yorum-zaman-akisi-meta { color: --muted--; font-size: 0.84rem; }
  .modulex-yorum-zaman-akisi-alinti { line-height: 1.7; }
  @media (max-width: 768px) {
    .modulex-yorum-zaman-akisi-oge { grid-template-columns: 40px minmax(0, 1fr); gap: 12px; }
    .modulex-yorum-zaman-akisi-akis::before { inset-inline-start: 19px; }
    .modulex-yorum-zaman-akisi-avatar { width: 36px; height: 36px; font-size: 0.75rem; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-yorum-zaman-akisi :is(.modulex-yorum-zaman-akisi-baslik, .modulex-yorum-zaman-akisi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-yorum-zaman-akisi-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-yorum-zaman-akisi-ic { grid-template-columns: minmax(0, 1fr); }
    .modulex-yorum-zaman-akisi-bas { position: static; margin-block-end: 32px; }
  }
  @media (max-width: 768px) {
    .modulex-yorum-zaman-akisi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-yorum-zaman-akisi *, .modulex-yorum-zaman-akisi *::before, .modulex-yorum-zaman-akisi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-yorum-zaman-akisi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
